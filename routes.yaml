routes:
  /preview/:
    template: home-preview
  # Archivo combinado del bloque "Tecnología y Energía" de la portada.
  # Ver docs/rutas-personalizadas.md
  /tecnologia-y-energia/:
    controller: channel
    filter: primary_tag:[tecnologia,energia]
    template: tecnologia-energia

collections:
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
