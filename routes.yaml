routes:
  /preview/:
    template: home-preview
  # Archivo combinado del bloque "Agua y Energía" de la portada.
  # Ver docs/rutas-personalizadas.md
  /agua-y-energia/:
    controller: channel
    filter: primary_tag:[agua,energia]
    template: agua-energia

collections:
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
